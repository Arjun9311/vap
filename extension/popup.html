<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Mode</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="header-row">
        <div class="logo">
            <div class="logo-dot"></div>
            <h3>Dark Mode</h3>
        </div>
        <button id="open-options" class="options-btn" title="Open Settings">
            <svg viewBox="0 0 24 24">
                <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
            </svg>
        </button>
    </div>

    <div class="badge-row">
        <span class="cpp-mode-tag">⚡ C++ Master Mode Active</span>
    </div>

    <div class="action-buttons">
        <button id="btn-open-panel" class="main-action-btn primary">
            <span>🚀</span> Open Assistant Panel
        </button>
        <div class="btn-row">
            <button id="btn-scan-text" class="main-action-btn secondary">⚡ Scan Text</button>
            <button id="btn-scan-vision" class="main-action-btn secondary">📷 Scan Vision</button>
        </div>
    </div>

    <div class="status-card">
        <div class="status-row">
            <span class="status-label">Server Health:</span>
            <span id="server-status">checking...</span>
        </div>
    </div>

    <div class="shortcuts">
        <div class="shortcuts-title">Keyboard Shortcuts</div>
        <div class="shortcut-row"><span>Text scan</span> <kbd>`</kbd></div>
        <div class="shortcut-row"><span>Vision scan</span> <kbd>\</kbd></div>
        <div class="shortcut-row"><span>Minimal mode</span> <kbd>[</kbd></div>
        <div class="shortcut-row"><span>Stealth mode</span> <kbd>]</kbd></div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
